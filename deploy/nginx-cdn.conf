# ── HabbitCorp CDN ──────────────────────────────────────────────
# Serve HabbitCorp/cdn (nitro-assets/ + swf/ + frank/) atrás do Cloudflare.
# Pré-requisito na VPS:
#   git clone --depth 1 https://github.com/HabbitCorp/cdn /var/www/cdn
# Instalar:
#   sudo cp /var/www/cdn/deploy/nginx-cdn.conf /etc/nginx/sites-available/cdn.conf
#   sudo ln -s /etc/nginx/sites-available/cdn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name cdn.SEUDOMINIO.com;          # <-- seu subdomínio de CDN

    root /var/www/cdn;                        # <-- onde clonou o repo cdn

    # gzip — gamedata JSON é grande (FurnitureData 26MB -> ~3MB).
    # .nitro / png / gif já são comprimidos: não re-gzipar.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/xml image/svg+xml text/plain;

    # .nitro -> octet-stream + cache imutável (cada arquivo nunca muda de conteúdo)
    location ~ \.nitro$ {
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # resto (json / png / gif / mp3 / xml) + CORS completo
    # (o client Nitro busca os assets cross-origin: sem CORS, não carrega)
    location / {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Cache-Control "public, max-age=604800";   # 7 dias; use ?vN no gamedata
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri $uri/ =404;
    }

    access_log off;   # CDN = muito request; desligado por performance

    # ── HTTPS atrás do Cloudflare ──────────────────────────────────
    # Comece com Cloudflare SSL/TLS = "Flexible" (só este server :80 basta).
    # Para "Full (strict)" (recomendado): gere um Origin Certificate no
    # Cloudflare e descomente:
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/ssl/cloudflare/cdn.pem;
    #   ssl_certificate_key /etc/ssl/cloudflare/cdn.key;
}
